name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend:
    name: Python tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wealthos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/wealthos_test
      # The runner's Postgres requires a password; a development machine
      # authenticates the OS user with none. backend/tests/conftest.py reads
      # this, and refuses any database whose name does not end in _test.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/wealthos_test
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyTorch publishes no 3.14 wheels; the project is pinned to 3.12.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # CPU torch first, from PyTorch's own index. The bare torch==2.8.0 pin
        # resolves to the CUDA build on Linux and drags in ~2.5 GB of nvidia-*
        # wheels this job can never use; `==2.8.0` matches 2.8.0+cpu, so
        # requirements.txt then sees the pin as satisfied. Same reasoning as
        # docker/Dockerfile.backend.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements.txt
          pip install -e .

      - name: Run migrations
        run: cd backend && alembic upgrade head

      - name: Test
        # Data-quality and model tests skip themselves when the pipeline
        # artifacts are absent, which they are on a clean runner. The core
        # analytics and API suites run in full.
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Type-check
        run: cd frontend && npx tsc --noEmit

      - name: Lint
        run: cd frontend && pnpm lint

      - name: Build
        run: cd frontend && pnpm build
