# Render blueprint for the WealthOS API and database.
# The frontend deploys to Vercel; see docs/deployment.md.
services:
  - type: web
    name: wealthos-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    # Free tier: 512 MB RAM, sleeps after 15 minutes idle (first request
    # then takes 30-60s). Warm it before a demonstration.
    plan: free
    healthCheckPath: /health
    # Migrations run before the server, so a fresh database comes up usable.
    #
    # Plain $PORT, never ${PORT:-8000}. Render interpolates this string itself
    # before a shell sees it and does not understand bash default-value
    # syntax: it substitutes the ${PORT part and leaves `:-8000}` as literal
    # text, so uvicorn is handed `--port 10000:-8000}` and exits 2. Plain
    # $PORT is correct whether Render expands it or the shell does.
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: wealthos-db, property: connectionString }
      - key: JWT_SECRET_KEY
        generateValue: true          # Render generates and stores it
      - key: GEMINI_API_KEY
        sync: false                  # set by hand in the Render dashboard; never committed
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: LLM_PROVIDER
        value: auto                  # Gemini when its key is set, else Claude
      - key: ANTHROPIC_API_KEY
        sync: false                  # optional alternative to Gemini
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false                  # the Vercel URL, once it exists

databases:
  - name: wealthos-db
    databaseName: wealthos
    # Free Postgres is deleted after 30 days. Note the expiry date when the
    # blueprint deploys; moving to a paid plan later keeps the same URL.
    plan: free
