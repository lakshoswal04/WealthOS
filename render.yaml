# Render blueprint for the WealthOS API and database.
# The frontend deploys to Vercel; see docs/deployment.md.
services:
  - type: web
    name: wealthos-api
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    # Free tier: 512 MB RAM, sleeps after 15 minutes idle (first request
    # then takes 30-60s). Warm it before a demonstration.
    plan: free
    healthCheckPath: /health
    # Migrations run before the server, so a fresh database comes up usable.
    # Render injects PORT; bind it rather than a hard-coded 8000.
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: wealthos-db, property: connectionString }
      - key: JWT_SECRET_KEY
        generateValue: true          # Render generates and stores it
      - key: ANTHROPIC_API_KEY
        sync: false                  # set by hand; never committed
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false                  # the Vercel URL, once it exists

databases:
  - name: wealthos-db
    databaseName: wealthos
    # Free Postgres is deleted after 30 days. Note the expiry date when the
    # blueprint deploys; moving to a paid plan later keeps the same URL.
    plan: free
